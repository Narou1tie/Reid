<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>REID - Collection Femme</title>
    <style>
        /* CONFIGURATION GÉNÉRALE */
        body {
            background: linear-gradient(180deg, #1A1A1A 0%, #390007 100%);
            background-attachment: fixed;
            color: #FFFFFF;
            font-family: 'Century Gothic', sans-serif;
            margin: 0; display: flex; flex-direction: column; min-height: 100vh;
            overflow-x: hidden;
        }

        /* NAVIGATION */
        nav {
            display: flex; align-items: center; justify-content: space-between;
            background-color: rgba(0, 0, 0, 0.95); padding: 15px 60px;
            border-bottom: 1px solid rgba(155, 160, 171, 0.2); position: sticky; top: 0; z-index: 1000;
        }
        .brand-name { font-size: 2.2rem; font-weight: bold; letter-spacing: 10px; color: #FFFFFF; text-decoration: none; }
        .nav-links { display: flex; }
        .dropdown { position: relative; display: inline-block; }
        .dropbtn { color: #9BA0AB; text-decoration: none; padding: 10px 20px; font-size: 0.8rem; text-transform: uppercase; letter-spacing: 2px; }

        /* --- PANNEAU DE TRI COULISSANT (SIDEBAR) --- */
        .sidebar {
            position: fixed;
            left: -250px; /* Caché par défaut */
            top: 80px;
            width: 250px;
            height: calc(100vh - 80px);
            background: rgba(0, 0, 0, 0.9);
            border-right: 1px solid #390007;
            transition: 0.5s;
            z-index: 999;
            padding: 20px;
            box-sizing: border-box;
        }

        /* La classe qui ouvre le menu */
        .sidebar.active { left: 0; }

        /* Le petit bouton flèche */
        .toggle-sidebar {
            position: absolute;
            right: -40px;
            top: 20px;
            width: 40px;
            height: 40px;
            background: #390007;
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            border-radius: 0 10px 10px 0;
            font-size: 1.2rem;
        }

        .sidebar h3 { font-size: 0.9rem; letter-spacing: 2px; border-bottom: 1px solid #390007; padding-bottom: 10px; margin-top: 30px; }
        .filter-group { list-style: none; padding: 0; font-size: 0.8rem; color: #9BA0AB; }
        .filter-group li { padding: 8px 0; cursor: pointer; transition: 0.3s; }
        .filter-group li:hover { color: #FFFFFF; }

        /* CONTENEUR BOUTIQUE */
        .shop-container {
            padding: 40px 40px 40px 80px; /* Marge à gauche pour laisser la place à la flèche */
            transition: 0.5s;
        }

        /* GRILLE DE PRODUITS */
        .product-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(380px, 1fr));
            gap: 30px;
        }

        /* --- CARTE PRODUIT (PLUS HAUTE) --- */
        .product-card {
            background: #000000;
            border: 1px solid rgba(155, 160, 171, 0.1);
            border-radius: 15px;
            display: flex;
            height: 300px; /* Augmenté comme demandé */
            overflow: hidden;
            transition: 0.4s;
        }
        .product-card:hover { transform: translateY(-5px); border-color: rgba(155,160,171, 0.4); }

        .product-image { 
    width: 60%; /* L'image prend maintenant 60% de la largeur de la carte */
    background: #111; 
    overflow: hidden; 
}
        .product-image img { 
            width: 100%; height: 100%; object-fit: cover; 
            opacity: 0.9; transition: 0.3s; 
        }

        .product-info {
    width: 40%; /* Le texte prend le reste (40%) */
    padding: 20px;
    display: flex; 
    flex-direction: column; 
    justify-content: space-between;
}
        .product-info h4 { margin: 0; font-size: 1rem; letter-spacing: 1px; color: #FFFFFF; }
        .price { color: #9BA0AB; font-size: 0.9rem; margin: 5px 0; }
        
        /* COULEURS */
        .colors { display: flex; gap: 10px; margin: 15px 0; flex-wrap: wrap; }
        .color-circle {
            width: 18px; height: 18px; border-radius: 50%;
            border: 2px solid transparent;
            cursor: pointer; transition: 0.2s;
        }
        .color-circle.active { border-color: white; transform: scale(1.2); }

        .description { font-size: 0.75rem; color: #9BA0AB; line-height: 1.5; margin-top: 10px; }

        footer { text-align: center; padding: 60px; color: #9BA0AB; font-size: 0.7rem; }
    </style>
</head>
<body>

    <nav>
        <a href="index.html" class="brand-name">REID</a>
        <div class="nav-links">
            <div class="dropdown"><a href="femme.html" class="dropbtn" style="color:white">Femme</a></div>
            <div class="dropdown"><a href="#" class="dropbtn">Homme</a></div>
            <div class="dropdown"><a href="#" class="dropbtn">À venir</a></div>
        </div>
    </nav>

    <!-- SIDEBAR COULISSANTE -->
    <aside class="sidebar" id="sidebar">
        <div class="toggle-sidebar" onclick="toggleSidebar()">❯</div>
        <h3>TYPE</h3>
        <ul class="filter-group">
            <li>Vestes</li>
            <li>Hauts</li>
            <li>Bas</li>
            <li>Chaussures</li>
            <li>Accessoires</li>
        </ul>
        <h3>COLORIS</h3>
        <div class="colors">
            <div class="color-circle" style="background: #000;"></div>
            <div class="color-circle" style="background: #FFF;"></div>
            <div class="color-circle" style="background: #390007;"></div>
        </div>
    </aside>

    <div class="shop-container" id="main-content">
        <main class="product-grid">
            
            <!-- EXEMPLE PRODUIT INTERACTIF -->
            <div class="product-card">
                <div class="product-image">
                    <!-- On donne une ID à l'image pour pouvoir la changer -->
                    <img src="images/femme/vestes/veste-noire.gif" class="main-img" alt="Produit">
                </div>
                <div class="product-info">
                    <div>
                        <h4>VESTE REID V1</h4>
                        <div class="price">45.00 €</div>
                        
                        <div class="colors">
                            <!-- Ici le secret : data-image contient le lien de la version de couleur -->
                            <div class="color-circle active" 
                                 style="background: #000;" 
                                 onclick="changeImage(this, 'images/femme/vestes/veste-noire.gif')"></div>
                            
                            <div class="color-circle" 
                                 style="background: #390007;" 
                                 onclick="changeImage(this, 'images/femme/vestes/veste-rouge.gif')"></div>
                        </div>
                    </div>
                    <p class="description">Une coupe cintrée avec des détails néons. Disponible en plusieurs coloris exclusifs.</p>
                </div>
            </div>

            <!-- Ajoute tes autres cartes ici en suivant le même modèle -->

        </main>
    </div>

    <footer>&copy; 2024 REID STUDIO. TOUS DROITS RÉSERVÉS.</footer>

    <!-- PETIT SCRIPT POUR L'INTERACTIVITÉ -->
    <script>
        // Fonction pour ouvrir/fermer la sidebar
        function toggleSidebar() {
            const sidebar = document.getElementById('sidebar');
            const btn = document.querySelector('.toggle-sidebar');
            sidebar.classList.toggle('active');
            
            // On change le sens de la flèche
            if(sidebar.classList.contains('active')) {
                btn.innerHTML = "❮";
            } else {
                btn.innerHTML = "❯";
            }
        }

        // Fonction pour changer l'image au clic sur une couleur
        function changeImage(element, newSrc) {
            // 1. Trouver la carte parente
            const card = element.closest('.product-card');
            // 2. Changer l'image dans cette carte
            card.querySelector('.main-img').src = newSrc;
            
            // 3. Gérer le petit cercle blanc autour de la couleur sélectionnée
            const circles = card.querySelectorAll('.color-circle');
            circles.forEach(c => c.classList.remove('active'));
            element.classList.add('active');
        }
    </script>

</body>
</html>
