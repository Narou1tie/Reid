<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>REID - Studio Design</title>
    <style>
        /* CONFIGURATION GÉNÉRALE */
        body {
            background: linear-gradient(180deg, #1A1A1A 0%, #390007 100%);
            background-attachment: fixed;
            color: #FFFFFF;
            font-family: 'Century Gothic', AppleGothic, sans-serif;
            margin: 0;
            padding: 0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            overflow-x: hidden; /* Évite le défilement horizontal bizarre */
        }

        /* BARRE DE NAVIGATION */
        nav {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background-color: rgba(0, 0, 0, 0.9);
            padding: 20px 60px;
            border-bottom: 1px solid rgba(155, 160, 171, 0.2);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .brand-name {
            font-size: 2.2rem;
            font-weight: bold;
            letter-spacing: 10px;
            color: #FFFFFF;
        }

        .nav-links a {
            color: #9BA0AB;
            text-decoration: none;
            margin-left: 30px;
            font-size: 0.9rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            transition: color 0.3s;
        }

        .nav-links a:hover {
            color: #FFFFFF;
        }

        /* CONTENU PRINCIPAL */
        .container {
            flex: 1;
            /* Largeur augmentée pour contenir 3 cartes de 500px + les espaces */
            max-width: 1700px; 
            margin: 80px auto;
            padding: 0 40px;
        }

        /* ALIGNEMENT HORIZONTAL DES CARTES */
        .sections-grid {
            display: flex; /* Utilisation de Flex pour garder l'alignement horizontal */
            flex-wrap: wrap; /* Permet de passer à la ligne sur petit écran */
            justify-content: center; /* Centre les cartes sur la page */
            
            /* --- ESPACE ENTRE LES CARTES (MODIFIABLE ICI) --- */
            gap: 50px; 
        }

        .card {
            background-color: #000000;
            border-radius: 20px; /* Un peu moins arrondi pour un look plus "éditorial" */
            overflow: hidden;
            border: 1px solid rgba(155, 160, 171, 0.2);
            transition: all 0.5s cubic-bezier(0.25, 0.46, 0.45, 0.94);
            position: relative;

            /* --- DIMENSIONS DES CARTES (MODIFIABLES ICI) --- */
            width: 500px;  /* Largeur */
            height: 600px; /* Hauteur */
        }

        /* EFFET AU SURVOL (NÉON) */
        .card:hover {
            transform: translateY(-15px);
            border-color: #ff0015;
            /* Lueur néon rouge plus diffuse */
            box-shadow: 0 10px 30px rgba(255, 0, 21, 0.3), 
                        0 0 60px rgba(57, 0, 7, 0.2);
        }

        .card-media {
            width: 100%;
            height: 100%;
            object-fit: cover; /* Le GIF de 500x500 remplira les 500x600 proprement */
            opacity: 0.7;
            transition: opacity 0.5s, transform 0.8s;
        }

        .card:hover .card-media {
            opacity: 1;
            transform: scale(1.05); /* Petit zoom au survol pour l'élégance */
        }

        .card h2 {
            position: absolute;
            bottom: 40px;
            left: 0;
            right: 0;
            text-align: center;
            margin: 0;
            font-size: 2rem;
            letter-spacing: 8px;
            text-transform: uppercase;
            text-shadow: 0px 5px 15px rgba(0,0,0,0.9);
            pointer-events: none; /* Le texte ne gêne pas le survol */
        }

        footer {
            text-align: center;
            padding: 80px 20px;
            color: #9BA0AB;
            font-size: 0.8rem;
            letter-spacing: 4px;
            opacity: 0.6;
        }

        /* Ajustement pour les petits écrans (tablettes/mobiles) */
        @media (max-width: 1200px) {
            .card {
                width: 90%; /* Les cartes prennent la largeur de l'écran si c'est trop petit */
                height: 500px;
            }
        }
    </style>
</head>
<body>

    <nav>
        <span class="brand-name">REID</span>
        <div class="nav-links">
            <a href="#">Femme</a>
            <a href="#">Homme</a>
            <a href="#">À venir</a>
        </div>
    </nav>

    <div class="container">
        <div class="sections-grid">
            
            <div class="card">
                <img src="https://i.ibb.co/xqtkCwMF/heart-ezgif-com-resize.gif" alt="Femme" class="card-media">
                <h2>FEMME</h2>
            </div>

            <div class="card">
                <img src="https://i.ibb.co/Pv4xXRdV/From-Klickpin-com-Seethese21-Freshnaturalskincareroutineideasthathelpyoucreateapolishedlookwithverysi.gif" alt="Homme" class="card-media">
                <h2>HOMME</h2>
            </div>

            <div class="card">
                <img src="https://i.ibb.co/JRLs3Y6d/ezgif-com-resize-1.gif" alt="À venir" class="card-media">
                <h2>À VENIR</h2>
            </div>

        </div>
    </div>

    <footer>
        &copy; 2024 REID STUDIO. TOUS DROITS RÉSERVÉS.
    </footer>

</body>
</html>
