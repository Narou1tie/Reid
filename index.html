<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>REID - Studio Design</title>
    <style>
        /* CONFIGURATION GÉNÉRALE */
        body {
            background: linear-gradient(180deg, #1A1A1A 0%, #390007 100%);
            background-attachment: fixed;
            color: #FFFFFF;
            font-family: 'Century Gothic', AppleGothic, sans-serif;
            margin: 0;
            padding: 0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            overflow-x: hidden;
        }

        /* BARRE DE NAVIGATION */
        nav {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background-color: rgba(0, 0, 0, 0.95);
            padding: 15px 60px;
            border-bottom: 1px solid rgba(155, 160, 171, 0.2);
            position: sticky;
            top: 0;
            z-index: 1000; /* Très haut pour passer devant les cartes */
        }

        .brand-name {
            font-size: 2.2rem;
            font-weight: bold;
            letter-spacing: 10px;
            color: #FFFFFF;
            text-decoration: none;
        }

        .nav-links {
            display: flex;
        }

        /* STYLE DES MENUS DÉROULANTS */
        .dropdown {
            position: relative;
            display: inline-block;
        }

        .dropbtn {
            color: #9BA0AB;
            text-decoration: none;
            padding: 10px 20px;
            font-size: 0.9rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            transition: color 0.3s;
            display: block;
        }

        .dropdown:hover .dropbtn {
            color: #FFFFFF;
        }

        /* LE CONTENU DU MENU (CACHÉ PAR DÉFAUT) */
        .dropdown-content {
            display: none;
            position: absolute;
            background-color: rgba(0, 0, 0, 0.95);
            min-width: 220px;
            box-shadow: 0px 10px 30px rgba(0,0,0,0.8);
            border: 1px solid #390007; /* Rappel du rouge sombre */
            z-index: 1;
            padding: 10px 0;
            border-radius: 0 0 10px 10px;
        }

        /* LIENS À L'INTÉRIEUR DU MENU */
        .dropdown-content a {
            color: #9BA0AB;
            padding: 12px 20px;
            text-decoration: none;
            display: block;
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: all 0.3s;
        }

        /* SURVOL DES LIENS DU MENU */
        .dropdown-content a:hover {
            background-color: #1A1A1A;
            color: #FFFFFF;
            padding-left: 30px; /* Petit effet de décalage */
            border-left: 3px solid #ff0015; /* Petite barre néon à gauche */
        }

        /* AFFICHER LE MENU AU SURVOL */
        .dropdown:hover .dropdown-content {
            display: block;
        }

        /* CONTENU PRINCIPAL */
        .container {
            flex: 1;
            max-width: 1700px; 
            margin: 80px auto;
            padding: 0 40px;
        }

        .sections-grid {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 50px; 
        }

        .card {
            background-color: #000000;
            border-radius: 20px;
            overflow: hidden;
            border: 1px solid rgba(155, 160, 171, 0.2);
            transition: all 0.5s cubic-bezier(0.25, 0.46, 0.45, 0.94);
            position: relative;
            width: 500px;
            height: 600px;
        }

        .card:hover {
            transform: translateY(-15px);
            border-color: #ff0015;
            box-shadow: 0 10px 30px rgba(255, 0, 21, 0.3);
        }

        .card-media {
            width: 100%;
            height: 100%;
            object-fit: cover;
            opacity: 0.7;
            transition: opacity 0.5s, transform 0.8s;
        }

        .card:hover .card-media {
            opacity: 1;
            transform: scale(1.05);
        }

        .card h2 {
            position: absolute;
            bottom: 40px;
            left: 0;
            right: 0;
            text-align: center;
            margin: 0;
            font-size: 2rem;
            letter-spacing: 8px;
            text-transform: uppercase;
            text-shadow: 0px 5px 15px rgba(0,0,0,0.9);
            pointer-events: none;
        }

        footer {
            text-align: center;
            padding: 80px 20px;
            color: #9BA0AB;
            font-size: 0.8rem;
            letter-spacing: 4px;
            opacity: 0.6;
        }
    </style>
</head>
