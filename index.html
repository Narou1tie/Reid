<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reid</title>
    <style>
        /* Les styles (CSS) commencent ici */
        body {
            background-color: #1A1A1A; /* Fond anthracite */
            color: #FFFFFF; /* Texte blanc */
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 0;
        }

        header {
            background-color: #000000;
            padding: 2rem;
            text-align: center;
            border-bottom: 2px solid #390007; /* Ligne rouge sombre */
        }

        header h1 {
            margin: 0;
            letter-spacing: 3px;
            text-transform: uppercase;
        }

        nav {
            display: flex;
            justify-content: center;
            background-color: #000000;
            padding: 1rem;
        }

        nav a {
            color: #9BA0AB; /* Gris-bleu */
            text-decoration: none;
            margin: 0 20px;
            font-weight: bold;
            transition: color 0.3s;
        }

        nav a:hover {
            color: #390007; /* Devient rouge au survol */
        }

        .container {
            max-width: 1000px;
            margin: 2rem auto;
            padding: 0 20px;
        }

        .sections-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-top: 2rem;
        }

        .card {
            background-color: #000000;
            border: 1px solid #9BA0AB;
            padding: 40px 20px;
            text-align: center;
            transition: transform 0.3s, border-color 0.3s;
            cursor: pointer;
        }

        .card:hover {
            transform: translateY(-5px);
            border-color: #390007;
        }

        .card h2 {
            margin: 0;
            color: #FFFFFF;
        }

        footer {
            text-align: center;
            padding: 2rem;
            color: #9BA0AB;
            font-size: 0.8rem;
            margin-top: 4rem;
        }
    </style>
</head>
<body>

    <header>
        <h1>DESIGN STUDIO</h1>
    </header>

    <nav>
        <a href="#">FEMME</a>
        <a href="#">HOMME</a>
        <a href="#">COLLECTIONS</a>
    </nav>

    <div class="container">
        <p style="text-align: center; color: #9BA0AB;">Bienvenue dans mon atelier numérique pour [Nom du Jeu].</p>
        
        <div class="sections-grid">
            <div class="card">
                <h2>FEMME</h2>
            </div>
            <div class="card">
                <h2>HOMME</h2>
            </div>
            <div class="card">
                <h2>À VENIR</h2>
            </div>
        </div>
    </div>

    <footer>
        &copy; 2024 - Créations pour [Nom du Jeu] - Réalisé avec GitHub
    </footer>

</body>
</html>
